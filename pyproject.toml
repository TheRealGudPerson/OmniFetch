[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "omnifetch"
version = "0.1.0"
description = "A multi-engine media downloader for Android Termux"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "TheRealGudPerson" }]
dependencies = []

[project.scripts]
omnifetch = "omnifetch.cli:main"

[tool.setuptools]
packages = ["omnifetch"]
